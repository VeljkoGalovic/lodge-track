name: CI/CD Pipeline

on:
  workflow_dispatch: {}
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]

env:
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
  RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
  LEMON_SQUEEZY_API_KEY: ${{ secrets.LEMON_SQUEEZY_API_KEY }}
  LEMON_SQUEEZY_WEBHOOK_SECRET: ${{ secrets.LEMON_SQUEEZY_WEBHOOK_SECRET }}
  LEMON_SQUEEZY_STORE_ID: ${{ secrets.LEMON_SQUEEZY_STORE_ID }}
  LEMON_SQUEEZY_STARTER_VARIANT_ID: ${{ secrets.LEMON_SQUEEZY_STARTER_VARIANT_ID }}
  LEMON_SQUEEZY_PRO_VARIANT_ID: ${{ secrets.LEMON_SQUEEZY_PRO_VARIANT_ID }}
  LEMON_SQUEEZY_BUSINESS_VARIANT_ID: ${{ secrets.LEMON_SQUEEZY_BUSINESS_VARIANT_ID }}
  # NEXT_PUBLIC_* values are INLINED into the Next build, so this must be a
  # repo *variable* (ci/vars), not a secret; empty at build time broke every
  # absolute link generated client- and server-side (see lib/email.ts).
  NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
  # wrangler 4 requires Node >= 22 (local dev runs 22).
  NODE_VERSION: '22.x'

jobs:
  # =========================================================================
  # CI: Type checking, linting, and tests on every PR
  # =========================================================================
  ci:
    name: CI (Type Check, Lint, Test)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Type check
        run: npm run build --if-present || npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm run test

  # =========================================================================
  # Deploy to Cloudflare Workers via @opennextjs/cloudflare
  # =========================================================================
  deploy:
    name: Deploy to Cloudflare (OpenNext Workers)
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Runs `prisma generate && next build`, then adapts the standalone
      # output into `.open-next/` (worker.js + assets) for the Workers runtime.
      - name: Build OpenNext bundle for Cloudflare
        run: npm run build:cf
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          LEMON_SQUEEZY_API_KEY: ${{ secrets.LEMON_SQUEEZY_API_KEY }}
          LEMON_SQUEEZY_WEBHOOK_SECRET: ${{ secrets.LEMON_SQUEEZY_WEBHOOK_SECRET }}
          LEMON_SQUEEZY_STORE_ID: ${{ secrets.LEMON_SQUEEZY_STORE_ID }}
          LEMON_SQUEEZY_STARTER_VARIANT_ID: ${{ secrets.LEMON_SQUEEZY_STARTER_VARIANT_ID }}
          LEMON_SQUEEZY_PRO_VARIANT_ID: ${{ secrets.LEMON_SQUEEZY_PRO_VARIANT_ID }}
          LEMON_SQUEEZY_BUSINESS_VARIANT_ID: ${{ secrets.LEMON_SQUEEZY_BUSINESS_VARIANT_ID }}
          NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}

      # prisma generate happens inside the build above; the worker bundle is
      # fully engine-free (WASM query compiler inlined as base64), so nothing
      # native ships and no post-deploy steps are needed.
      #
      # Deploy directly with the project's pinned wrangler (package.json,
      # installed by `npm ci`). The wrangler-action v3 by default forced its
      # own wrangler@3.90.0 into node_modules, which predates `wrangler.jsonc`
      # support and failed with "Missing entry-point" despite the `main` field.
      - name: Deploy to Cloudflare Workers
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  # =========================================================================
  # Sync Lemon Squeezy runtime secrets into the Worker (manual trigger)
  # =========================================================================
  # The Worker fallback reads LEMON_SQUEEZY_* at request time from dashboard
  # secret storage; those values drift when billing config changes (e.g. the
  # switch from Test to Live + the single-subscription product). This job
  # re-pushes them with `wrangler secret put` (value via stdin) using the
  # repo's CLOUDFLARE_API_TOKEN — it requires that token to have the
  # "Workers Secrets: Edit" permission.
  sync-worker-secrets:
    name: Sync Worker LS secrets
    needs: ci
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Push Lemon Squeezy secrets to the Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          LEMON_SQUEEZY_API_KEY: ${{ secrets.LEMON_SQUEEZY_API_KEY }}
          LEMON_SQUEEZY_WEBHOOK_SECRET: ${{ secrets.LEMON_SQUEEZY_WEBHOOK_SECRET }}
          LEMON_SQUEEZY_STORE_ID: ${{ secrets.LEMON_SQUEEZY_STORE_ID }}
          LEMON_SQUEEZY_STARTER_VARIANT_ID: ${{ secrets.LEMON_SQUEEZY_STARTER_VARIANT_ID }}
          LEMON_SQUEEZY_PRO_VARIANT_ID: ${{ secrets.LEMON_SQUEEZY_PRO_VARIANT_ID }}
          LEMON_SQUEEZY_BUSINESS_VARIANT_ID: ${{ secrets.LEMON_SQUEEZY_BUSINESS_VARIANT_ID }}
        run: |
          set -euo pipefail
          ok=0
          for NAME in \
            LEMON_SQUEEZY_API_KEY \
            LEMON_SQUEEZY_WEBHOOK_SECRET \
            LEMON_SQUEEZY_STORE_ID \
            LEMON_SQUEEZY_STARTER_VARIANT_ID \
            LEMON_SQUEEZY_PRO_VARIANT_ID \
            LEMON_SQUEEZY_BUSINESS_VARIANT_ID; do
            if printf '%s' "${!NAME}" | npx wrangler secret put "$NAME"; then
              echo "pushed $NAME"
              ok=$((ok+1))
            else
              echo "FAILED: $NAME"
              exit 1
            fi
          done
          echo "synced $ok/6 worker secrets"
