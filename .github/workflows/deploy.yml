name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
  RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
  LEVER_SQUEEZY_API_KEY: ${{ secrets.LEVER_SQUEEZY_API_KEY }}
  LEVER_SQUEEZY_WEBHOOK_SECRET: ${{ secrets.LEVER_SQUEEZY_WEBHOOK_SECRET }}
  LEVER_SQUEEZY_STORE_ID: ${{ secrets.LEVER_SQUEEZY_STORE_ID }}
  LEVER_SQUEEZY_PRO_VARIANT_ID: ${{ secrets.LEVER_SQUEEZY_PRO_VARIANT_ID }}
  LEVER_SQUEEZY_BUSINESS_VARIANT_ID: ${{ secrets.LEVER_SQUEEZY_BUSINESS_VARIANT_ID }}
  NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
  NODE_VERSION: '20.x'

jobs:
  # =========================================================================
  # CI: Type checking, linting, and tests on every PR
  # =========================================================================
  ci:
    name: CI (Type Check, Lint, Test)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Type check
        run: npm run build --if-present || npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm run test

  # =========================================================================
  # Deploy to Staging on merge to main
  # =========================================================================
  deploy-staging:
    name: Deploy to Staging
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run database migrations
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Build application
        run: npm run build

      - name: Deploy to staging
        run: echo "Deploy to staging infrastructure here (e.g., Vercel, Railway, Fly.io, etc.)"
        # Example for Vercel:
        # uses: amondnet/vercel-action@v25
        # with:
        #   vercel-token: ${{ secrets.VERCEL_TOKEN }}
        #   vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
        #   vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
        #   vercel-args: '--prod=false'
        #   working-directory: ./

  # =========================================================================
  # Deploy to Production (manual approval required)
  # =========================================================================
  deploy-production:
    name: Deploy to Production
    needs: deploy-staging
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run database migrations
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Build application
        run: npm run build

      - name: Deploy to production
        run: echo "Deploy to production infrastructure here"
        # Example for Vercel:
        # uses: amondnet/vercel-action@v25
        # with:
        #   vercel-token: ${{ secrets.VERCEL_TOKEN }}
        #   vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
        #   vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
        #   vercel-args: '--prod=true'
        #   working-directory: ./